[project]
name = "pub-search-kit"
version = "0.2.0"
description = "Unified adapters for querying biomedical publication APIs."
readme = "README.md"
authors = [
    { name = "numanburakfidan", email = "numanburakfidan@yandex.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
